---
# cPanel Git Version Control deployment.
#
# cPanel clones this repo to ~/repositories/wp1 and runs these tasks when you
# click "Deploy HEAD Commit". The clone is a staging copy — this file is what
# copies it into the live theme directory.
#
# storage/ is excluded deliberately. It holds leads.log, the contact-form
# submissions (customer names, email addresses, IP addresses). That file is
# gitignored, so it does not exist in the repo — and with --delete, rsync would
# erase it from the server on every single deploy. Excluding the directory keeps
# it and its .htaccess intact.
#
# --chmod is not optional. `rsync -a` preserves the source's permissions, and
# the files in the cPanel clone are created under that account's umask, which
# can leave them owner-only. PHP still reads them, because PHP runs as the
# account — but Apache serves static files as another user and returns 403 for
# every stylesheet, script, font and image. The site then renders as unstyled
# HTML with no obvious error anywhere. Forcing 755 on directories and 644 on
# files makes each deploy correct regardless of the umask it inherited.
deployment:
  tasks:
    - export DEPLOYPATH=/home2/gntlandscaping/public_html/wp-content/themes/mws
    - /bin/rsync -a --chmod=D755,F644 --delete --exclude='.git' --exclude='.cpanel.yml' --exclude='storage/' --exclude='node_modules/' ./ "$DEPLOYPATH/"
